<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Crop Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #0a0e27;
      --bg-darker: #050810;
      --surface: #1a1f3a;
      --surface-light: #242d4d;
      --border: #2a3f5f;
      --text: #e8ecff;
      --text-muted: #8b94b8;
      --accent: #00d4ff;
      --accent-light: #33e5ff;
      --success: #00ff88;
      --error: #ff4466;
      --radius: 16px;
      --radius-lg: 24px;
    }
    body {
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: clamp(12px, 3vw, 24px);
    }

    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-darker));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; gap: 32px; backdrop-filter: blur(10px);
    }
    .ring {
      width: 64px; height: 64px;
      border: 4px solid rgba(0, 212, 255, 0.2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      box-shadow: 0 0 24px rgba(0, 212, 255, 0.3);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load-text { color: var(--accent); font-size: clamp(14px, 2vw, 18px); text-align: center; font-weight: 500; }
    #load-err { color: var(--error); font-size: clamp(12px, 1.5vw, 14px); text-align: center; max-width: 320px; padding: 0 24px; display: none; }

    /* App */
    #app { display: none; max-width: 1200px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, rgba(10, 14, 39, 0.8), rgba(5, 8, 16, 0.8));
      backdrop-filter: blur(12px);
      padding: clamp(16px, 3vw, 24px);
      border-radius: var(--radius);
      border-bottom: 1px solid var(--border);
      margin-bottom: clamp(20px, 4vw, 32px);
    }
    header h1 { color: var(--accent); font-size: clamp(18px, 5vw, 24px); font-weight: 700; }

    .section {
      background: linear-gradient(135deg, var(--surface), var(--surface-light));
      padding: clamp(16px, 3vw, 24px);
      border-radius: var(--radius);
      margin-bottom: clamp(16px, 3vw, 24px);
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .section:hover { border-color: var(--accent); }
    .section h2 { color: var(--accent); font-size: clamp(16px, 2.5vw, 20px); margin-bottom: clamp(12px, 2vw, 16px); font-weight: 700; }

    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius-lg);
      padding: clamp(32px, 6vw, 48px) clamp(16px, 3vw, 24px);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.03), rgba(0, 212, 255, 0.01));
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(0, 212, 255, 0.1); }
    .upload-zone.filled { border-color: var(--success); padding: clamp(16px, 2vw, 20px); }
    .upload-zone .icon { font-size: clamp(36px, 8vw, 48px); margin-bottom: clamp(12px, 2vw, 16px); }
    .upload-zone p { color: var(--text-muted); font-size: clamp(12px, 1.8vw, 14px); line-height: 1.8; }
    .upload-zone .file-count { color: var(--accent); font-weight: 700; margin-top: 8px; font-size: clamp(12px, 1.8vw, 14px); }

    .btn {
      padding: clamp(10px, 2vw, 14px) clamp(16px, 3vw, 20px);
      border: none; border-radius: var(--radius);
      font-size: clamp(12px, 1.8vw, 14px);
      font-weight: 600; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin: clamp(4px, 1vw, 6px);
    }
    .btn-blue {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: var(--bg-dark);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
    }
    .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(0, 212, 255, 0.4); }
    .btn-blue:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-grey { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-grey:hover { border-color: var(--accent); color: var(--accent); background: rgba(0, 212, 255, 0.05); }
    .btn-red { background: var(--error); color: #fff; }
    .btn-red:hover { opacity: 0.9; }

    .button-group {
      display: flex; gap: clamp(8px, 1.5vw, 12px); flex-wrap: wrap; margin-top: clamp(12px, 2vw, 16px);
    }

    .progress-bar {
      width: 100%; background: var(--surface); border-radius: var(--radius);
      height: 6px; margin-top: clamp(12px, 2vw, 16px); overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent-light)); height: 100%; width: 0%; transition: width 0.4s ease; }

    .status { color: var(--text-muted); font-size: clamp(11px, 1.5vw, 13px); margin-top: clamp(8px, 1.5vw, 12px); }
    .status.info { color: var(--accent); font-weight: 600; }
    .status.success { color: var(--success); font-weight: 600; }
    .status.error { color: var(--error); font-weight: 600; }

    /* Gallery */
    .gallery {
      display: grid; gap: clamp(12px, 2vw, 16px);
      grid-template-columns: repeat(auto-fill, minmax(clamp(100px, 20vw, 140px), 1fr));
      margin-top: clamp(16px, 3vw, 20px);
    }
    .crop-item {
      position: relative; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border); transition: all 0.3s;
    }
    .crop-item:hover { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0, 212, 255, 0.15); transform: translateY(-4px); }
    .crop-item img { width: 100%; aspect-ratio: 1; display: block; background: var(--surface); object-fit: cover; }
    .crop-item .info {
      background: linear-gradient(135deg, var(--surface), var(--surface-light));
      padding: clamp(6px, 1vw, 8px);
      font-size: clamp(9px, 1.3vw, 11px);
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }
    .crop-item .actions {
      position: absolute; top: 0; right: 0;
      gap: 4px; display: flex;
      background: rgba(10, 14, 39, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 0 var(--radius) 0 var(--radius);
      opacity: 0; transition: opacity 0.2s;
    }
    .crop-item:hover .actions { opacity: 1; }
    .crop-item .actions button { padding: 4px 8px; font-size: 10px; }

    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: clamp(8px, 1.5vw, 12px);
      margin-top: clamp(20px, 4vw, 32px);
    }
    .pagination button {
      padding: clamp(8px, 1.5vw, 10px) clamp(12px, 2vw, 16px);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 600;
    }
    .pagination button:hover { border-color: var(--accent); color: var(--accent); background: rgba(0, 212, 255, 0.05); }
    .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
    .pagination span { color: var(--text-muted); font-size: clamp(11px, 1.5vw, 13px); font-weight: 600; }

    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: clamp(12px, 2vw, 16px); margin-top: clamp(16px, 3vw, 20px);
    }
    .stat-card {
      background: linear-gradient(135deg, var(--surface), var(--surface-light));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(12px, 2vw, 16px);
      text-align: center;
      transition: all 0.3s;
    }
    .stat-card:hover { border-color: var(--accent); }
    .stat-card .value { font-size: clamp(24px, 4vw, 32px); font-weight: 700; color: var(--accent); }
    .stat-card .label { font-size: clamp(10px, 1.3vw, 12px); color: var(--text-muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; }

    .hidden { display: none !important; }\n
    .site-nav {
      background: linear-gradient(135deg, rgba(10, 14, 39, 0.9), rgba(5, 8, 16, 0.9));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: clamp(8px, 1.5vw, 12px);
      margin: calc(-1 * clamp(12px, 3vw, 24px)) calc(-1 * clamp(12px, 3vw, 24px)) clamp(16px, 3vw, 24px);
    }
    .site-nav .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .site-nav a {
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: clamp(6px, 1.2vw, 8px) clamp(12px, 1.5vw, 14px);
      font-size: clamp(11px, 1.3vw, 13px);
      font-weight: 600;
      transition: all 0.2s;
    }
    .site-nav a:hover { border-color: var(--accent); color: var(--accent); background: rgba(0, 212, 255, 0.05); }
    .site-nav a.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: var(--bg-dark);
      border-color: var(--accent);
    }

    @media (max-width: 1024px) {
      .section { padding: clamp(16px, 2.5vw, 24px); }
      .upload-zone { padding: clamp(24px, 4vw, 32px) clamp(16px, 2.5vw, 24px); }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }

    @media (max-width: 768px) {
      body { padding: clamp(8px, 2vw, 16px); }
      .section { padding: clamp(12px, 2vw, 20px); margin-bottom: clamp(12px, 2vw, 20px); }
      header { padding: clamp(12px, 2vw, 20px); }
      .btn { padding: clamp(8px, 1.5vw, 10px) clamp(12px, 2vw, 16px); font-size: clamp(12px, 1.6vw, 14px); }
      .upload-zone { padding: clamp(20px, 3vw, 28px) clamp(12px, 2vw, 20px); }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: clamp(10px, 1.5vw, 12px); }
      .stats { grid-template-columns: repeat(2, 1fr); gap: clamp(10px, 1.5vw, 12px); }
      .button-group { gap: clamp(6px, 1vw, 10px); }
    }

    @media (max-width: 480px) {
      body { padding: clamp(6px, 1.5vw, 10px); }
      .section { padding: clamp(10px, 1.5vw, 16px); margin-bottom: clamp(10px, 1.5vw, 16px); }
      header { padding: clamp(10px, 1.5vw, 16px); margin-bottom: clamp(12px, 2vw, 16px); }
      header h1 { font-size: clamp(16px, 4vw, 20px); }
      .section h2 { font-size: clamp(14px, 2vw, 18px); margin-bottom: clamp(10px, 1.5vw, 12px); }
      .upload-zone { padding: clamp(16px, 2.5vw, 24px) clamp(10px, 1.5vw, 16px); }
      .upload-zone .icon { font-size: clamp(32px, 6vw, 40px); margin-bottom: clamp(8px, 1.5vw, 12px); }
      .upload-zone p { font-size: clamp(11px, 1.5vw, 13px); }
      .btn { padding: clamp(8px, 1.3vw, 9px) clamp(10px, 1.8vw, 14px); font-size: clamp(11px, 1.5vw, 13px); margin: clamp(3px, 0.8vw, 4px); }
      .gallery { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: clamp(8px, 1vw, 10px); }
      .stats { grid-template-columns: 1fr; gap: clamp(8px, 1.5vw, 10px); }
      .stat-card { padding: clamp(10px, 1.5vw, 12px); }
      .stat-card .value { font-size: clamp(20px, 3vw, 28px); }
      .stat-card .label { font-size: clamp(9px, 1.2vw, 11px); margin-top: 4px; }
      .pagination button { padding: clamp(6px, 1.2vw, 8px) clamp(8px, 1.3vw, 10px); font-size: clamp(10px, 1.3vw, 12px); }
      .button-group { gap: clamp(4px, 0.8vw, 6px); }
      .site-nav { padding: clamp(6px, 1vw, 8px); margin: calc(-1 * clamp(6px, 1.5vw, 10px)) calc(-1 * clamp(6px, 1.5vw, 10px)) clamp(10px, 1.5vw, 12px); }
      .site-nav a { padding: clamp(5px, 1vw, 6px) clamp(8px, 1.2vw, 10px); font-size: clamp(10px, 1.2vw, 11px); }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-dark: #f8f9fa;
        --bg-darker: #eff0f5;
        --surface: #ffffff;
        --surface-light: #f5f6f9;
        --border: #d8dce6;
        --text: #1a1a1a;
        --text-muted: #666666;
      }
    }
  </style>
</head>

<nav class="site-nav">

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="ring"></div>
  <div id="load-text">Loading face detection models...</div>
  <div id="load-err"></div>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>🎯 Face Crop Tool</h1>
  </header>

  <!-- Upload Section -->
  <div class="section">
    <h2>📤 Upload Photos</h2>
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" accept="image/*" multiple class="hidden" onchange="onFilesSelected(event)">
      <div class="icon">📷</div>
      <p>Tap to upload one or more photos<br>iPhone & Android supported</p>
      <div class="file-count hidden" id="file-count"></div>
    </div>
    <div class="button-group">
      <button class="btn btn-blue" id="process-btn" onclick="processPhotos()" disabled>🚀 Detect & Crop Faces</button>
      <button class="btn btn-grey" onclick="resetAll()">Clear All</button>
    </div>
  </div>

  <!-- Status Section -->
  <div class="section hidden" id="status-section">
    <h2>⏳ Processing</h2>
    <div id="status-text" class="status info"></div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Results Section -->
  <div class="section hidden" id="results-section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-blue" id="download-all-btn" onclick="downloadAllCrops()">⬇️ Download All</button>
        <button class="btn btn-blue" id="send-to-identify-btn" onclick="sendToIdentify()" title="Send cropped faces to identify queue">📤 Send to Identify</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="value" id="total-photos">0</div>
        <div class="label">Photos processed</div>
      </div>
      <div class="stat-card">
        <div class="value" id="total-faces">0</div>
        <div class="label">Faces detected</div>
      </div>
      <div class="stat-card">
        <div class="value" id="detection-time">0s</div>
        <div class="label">Total time</div>
      </div>
    </div>

    <!-- Gallery -->
    <div id="gallery" class="gallery"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination" style="display: none;">
      <button id="prev-btn" onclick="previousPage()">← Previous</button>
      <span id="page-info"></span>
      <button id="next-btn" onclick="nextPage()">Next →</button>
    </div>
  </div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
const CROP_PADDING = 0.2; // 20% padding around face
const CROPS_PER_PAGE = 30;

let selectedFiles = [];
let allCrops = []; // { original, processed, label, photoIndex, faceIndex, faceCount }
let currentPage = 0;
let cropViews = {}; // track which crops are showing original (true) or enhanced (false)

// ── Load Models ──────────────────────────────────────────────────────────────
async function loadModels() {
  try {
    setLoadText('Loading face detector...');
    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
    setLoadText('Loading landmark model...');
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    setLoadText('Ready ✓');
    await new Promise(r => setTimeout(r, 400));
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch (e) {
    setLoadText('');
    const err = document.getElementById('load-err');
    err.textContent = 'Model load failed: ' + e.message + '\n\nMake sure you have internet connection.';
    err.style.display = 'block';
    console.error(e);
  }
}

function setLoadText(t) {
  document.getElementById('load-text').textContent = t;
}

// ── File Handling ────────────────────────────────────────────────────────────
function onFilesSelected(event) {
  selectedFiles = Array.from(event.target.files || []);
  if (!selectedFiles.length) return;

  const countEl = document.getElementById('file-count');
  countEl.textContent = selectedFiles.length + ' photo' + (selectedFiles.length > 1 ? 's' : '') + ' selected';
  countEl.classList.remove('hidden');
  document.getElementById('upload-zone').classList.add('filled');
  document.getElementById('process-btn').disabled = false;
}

// ── Face Cropping ────────────────────────────────────────────────────────────
async function processPhotos() {
  if (!selectedFiles.length) return;

  allCrops = [];
  currentPage = 0;
  const startTime = Date.now();

  document.getElementById('status-section').classList.remove('hidden');
  document.getElementById('results-section').classList.add('hidden');
  document.getElementById('process-btn').disabled = true;

  let totalFaces = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    updateStatus(`Processing photo ${i + 1} of ${selectedFiles.length}: ${file.name}`);
    updateProgress((i / selectedFiles.length) * 100);

    try {
      const img = await loadImage(file);
      const detections = await faceapi.detectAllFaces(img, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 }));

      if (detections.length) {
        // Crop each detected face
        for (let j = 0; j < detections.length; j++) {
          const box = detections[j].box;
          const crop = cropFace(img, box, file.name, i, j, detections.length);
          allCrops.push(crop);
          totalFaces++;
        }
      }
    } catch (e) {
      console.error('Error processing', file.name, e);
      updateStatus(`Error processing ${file.name}`, 'error');
    }
  }

  const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
  updateProgress(100);
  updateStatus(`✓ Done! Detected ${totalFaces} faces in ${selectedFiles.length} photo(s)`, 'success');

  // Show results
  setTimeout(() => {
    document.getElementById('status-section').classList.add('hidden');
    document.getElementById('results-section').classList.remove('hidden');
    document.getElementById('total-photos').textContent = selectedFiles.length;
    document.getElementById('total-faces').textContent = totalFaces;
    document.getElementById('detection-time').textContent = elapsed + 's';
    renderGallery();
    document.getElementById('process-btn').disabled = false;
  }, 500);
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── Image Enhancement Functions ────────────────────────────────────────────
function enhanceImage(src, brightness = 1.1, contrast = 1.3) {
  const cvs = document.createElement('canvas');
  cvs.width = src.width; cvs.height = src.height;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(src, 0, 0);
  
  try {
    // Brightness + contrast adjustment
    const img = ctx.getImageData(0, 0, cvs.width, cvs.height);
    const data = img.data;
    const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
    
    for (let i = 0; i < data.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        let v = data[i + c] * brightness;
        v = factor * (v - 128) + 128;
        data[i + c] = Math.max(0, Math.min(255, v));
      }
    }
    ctx.putImageData(img, 0, 0);
  } catch (e) { console.warn('enhance failed', e); }
  
  // Apply strong unsharp mask for sharpening
  try {
    applyUnsharpMask(ctx, cvs.width, cvs.height, 2.0, 1.0, 0.5);
  } catch (e) { console.warn('sharpen failed', e); }
  
  return cvs;
}

// Unsharp mask: high-pass sharpening technique
function applyUnsharpMask(ctx, w, h, radius = 2.0, strength = 1.2, threshold = 0) {
  try {
    const img = ctx.getImageData(0, 0, w, h);
    const original = img.data.slice();
    
    // Create blurred version
    const blurred = new Uint8ClampedArray(original.length);
    const r = Math.round(radius);
    const r2 = r * 2 + 1;
    
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        for (let c = 0; c < 3; c++) {
          let sum = 0, count = 0;
          for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
              const ny = Math.max(0, Math.min(h - 1, y + dy));
              const nx = Math.max(0, Math.min(w - 1, x + dx));
              const idx = (ny * w + nx) * 4 + c;
              sum += original[idx];
              count++;
            }
          }
          const idx = (y * w + x) * 4 + c;
          blurred[idx] = sum / count;
        }
      }
    }
    
    // Apply unsharp mask: original + strength * (original - blurred)
    for (let i = 0; i < original.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        const diff = original[i + c] - blurred[i + c];
        if (Math.abs(diff) > threshold) {
          let sharpened = original[i + c] + strength * diff;
          img.data[i + c] = Math.max(0, Math.min(255, sharpened));
        } else {
          img.data[i + c] = original[i + c];
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  } catch (e) { console.warn('unsharp mask failed', e); }
}

function contrastStretch(ctx, w, h) {
  try {
    const img = ctx.getImageData(0, 0, w, h);
    const data = img.data;
    const min = [255, 255, 255], max = [0, 0, 0];
    for (let i = 0; i < data.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        const v = data[i + c];
        if (v < min[c]) min[c] = v;
        if (v > max[c]) max[c] = v;
      }
    }
    for (let i = 0; i < data.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        const v = data[i + c];
        const mn = min[c], mx = max[c];
        if (mx > mn) data[i + c] = Math.max(0, Math.min(255, Math.round((v - mn) * 255 / (mx - mn))));
      }
    }
    ctx.putImageData(img, 0, 0);
  } catch (e) { console.warn('contrast stretch failed', e); }
}

function cropFace(sourceImg, box, photoName, photoIdx, faceIdx, faceCount) {
  const { x, y, width, height } = box;
  const padding = Math.min(width, height) * CROP_PADDING;

  const cropX = Math.max(0, x - padding);
  const cropY = Math.max(0, y - padding);
  const cropW = Math.min(sourceImg.width - cropX, width + padding * 2);
  const cropH = Math.min(sourceImg.height - cropY, height + padding * 2);

  const canvas = document.createElement('canvas');
  canvas.width = cropW;
  canvas.height = cropH;

  const ctx = canvas.getContext('2d');
  ctx.drawImage(sourceImg, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

  // Apply enhancement: contrast stretch + brightness/contrast boost
  contrastStretch(ctx, cropW, cropH);
  const enhanced = enhanceImage(canvas, 1.1, 1.3);

  const label = `${photoName.replace(/\.[^.]+$/, '')}_Face${faceIdx + 1}`;
  return {
    original: canvas,
    processed: enhanced,
    label: label,
    photoIndex: photoIdx,
    faceIndex: faceIdx,
    faceCount: faceCount
  };
}

// ── Gallery Rendering ────────────────────────────────────────────────────────
function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  if (!allCrops.length) {
    gallery.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">No faces detected. Try uploading clearer photos.</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const start = currentPage * CROPS_PER_PAGE;
  const end = start + CROPS_PER_PAGE;
  const pageCrops = allCrops.slice(start, end);

  pageCrops.forEach((crop, idx) => {
    const globalIdx = start + idx;
    const item = document.createElement('div');
    item.className = 'crop-item';
    item.style.position = 'relative';

    const img = document.createElement('img');
    img.src = crop.processed.toDataURL('image/jpeg', 0.9);
    img.id = `crop-${globalIdx}`;
    img.style.cursor = 'pointer';
    img.title = 'Click to toggle original/enhanced';
    img.onclick = () => toggleCropView(globalIdx);

    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = crop.label + ' (Enhanced)';
    info.id = `info-${globalIdx}`;

    const actions = document.createElement('div');
    actions.className = 'actions';

    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn btn-blue';
    dlBtn.textContent = '⬇️';
    dlBtn.onclick = () => downloadCrop(globalIdx);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-grey';
    copyBtn.textContent = '📋';
    copyBtn.onclick = () => copyCropToClipboard(globalIdx);

    actions.appendChild(dlBtn);
    actions.appendChild(copyBtn);

    item.appendChild(img);
    item.appendChild(info);
    item.appendChild(actions);
    gallery.appendChild(item);
  });

  updatePagination();
}

// Toggle between original and enhanced view
function toggleCropView(index) {
  cropViews[index] = !cropViews[index]; // toggle
  const crop = allCrops[index];
  const imgEl = document.getElementById(`crop-${index}`);
  const infoEl = document.getElementById(`info-${index}`);
  
  if (cropViews[index]) {
    // Show original
    imgEl.src = crop.original.toDataURL('image/jpeg', 0.9);
    infoEl.textContent = crop.label + ' (Original)';
  } else {
    // Show enhanced
    imgEl.src = crop.processed.toDataURL('image/jpeg', 0.9);
    infoEl.textContent = crop.label + ' (Enhanced)';
  }
}

function updatePagination() {
  const totalPages = Math.ceil(allCrops.length / CROPS_PER_PAGE);
  if (totalPages <= 1) {
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  document.getElementById('pagination').style.display = 'flex';
  document.getElementById('page-info').textContent = `Page ${currentPage + 1} of ${totalPages}`;
  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;
}

function previousPage() {
  if (currentPage > 0) {
    currentPage--;
    renderGallery();
    document.querySelector('.gallery').scrollIntoView({ behavior: 'smooth' });
  }
}

function nextPage() {
  const totalPages = Math.ceil(allCrops.length / CROPS_PER_PAGE);
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderGallery();
    document.querySelector('.gallery').scrollIntoView({ behavior: 'smooth' });
  }
}

// ── Download ─────────────────────────────────────────────────────────────────
async function downloadCrop(index) {
  const crop = allCrops[index];
  const canvas = cropViews[index] ? crop.original : crop.processed;
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/jpeg', 0.95);
  link.download = crop.label + (cropViews[index] ? '_original' : '_enhanced') + '.jpg';
  link.click();
}

async function copyCropToClipboard(index) {
  const crop = allCrops[index];
  const canvas = cropViews[index] ? crop.original : crop.processed;
  canvas.toBlob(blob => {
    navigator.clipboard.write([
      new ClipboardItem({ 'image/png': blob })
    ]).then(() => {
      alert('✓ Copied to clipboard!');
    }).catch(err => {
      console.error('Failed to copy:', err);
    });
  });
}

async function downloadAllCrops() {
  if (!allCrops.length) return;

  if (confirm(`Download ${allCrops.length} cropped faces (enhanced version)?`)) {
    for (let i = 0; i < allCrops.length; i++) {
      const crop = allCrops[i];
      const canvas = crop.processed; // always use enhanced for batch
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.download = crop.label + '_enhanced.jpg';
      
      await new Promise(resolve => {
        setTimeout(() => {
          link.click();
          resolve();
        }, 100 * (i % 5));
      });
    }
  }
}

// ── UI Helpers ───────────────────────────────────────────────────────────────
function updateStatus(msg, type = 'info') {
  const el = document.getElementById('status-text');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function updateProgress(percent) {
  document.getElementById('progress-fill').style.width = percent + '%';
}

function resetAll() {
  selectedFiles = [];
  allCrops = [];
  currentPage = 0;
  cropViews = {};
  document.getElementById('file-input').value = '';
  document.getElementById('file-count').classList.add('hidden');
  document.getElementById('file-count').textContent = '';
  document.getElementById('upload-zone').classList.remove('filled');
  document.getElementById('process-btn').disabled = true;
  document.getElementById('status-section').classList.add('hidden');
  document.getElementById('results-section').classList.add('hidden');
}

// ── Bridge to Identify ────────────────────────────────────────────────────────
function sendToIdentify() {
  if (!allCrops.length) { alert('No cropped faces to send'); return; }
  
  try {
    let queue = [];
    allCrops.forEach((crop, idx) => {
      const b64 = crop.processed.toDataURL('image/jpeg', 0.95);
      queue.push({
        b64: b64,
        label: crop.label
      });
    });
    
    // Store queue in localStorage
    const existing = JSON.parse(localStorage.getItem('identify_queue') || '[]');
    const merged = existing.concat(queue);
    localStorage.setItem('identify_queue', JSON.stringify(merged));
    
    alert(`✓ Sent ${allCrops.length} cropped faces to identify queue!\n\nGo to index.html and click "🚀 Batch Identify" to process them.`);
  } catch (e) {
    alert('Error sending to identify: ' + e.message);
    console.error(e);
  }
}

// Start
window.addEventListener('load', loadModels);
</script>
